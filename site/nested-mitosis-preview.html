<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050607">
  <title>Preparing nested document · BillyDPI</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./nested-mitosis.css?v=0.3.0">
  <script src="./nested-mitosis.js?v=0.3.0" defer></script>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      color-scheme:dark;background:#050607;color:#f2f2f2;font-synthesis:none}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050607}
    body{min-height:100dvh;display:grid;place-items:center}
    main{width:100%;padding:32px 20px;display:flex;align-items:center;justify-content:center}
    .stage{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%}
    h1{margin:0;text-align:center;font-size:clamp(20px,3.2vw,27px);
      font-weight:650;letter-spacing:-.035em;line-height:1.3;color:#f3f3f3}
    .animation-shell{width:min(470px,100%)}
    .billy-mitosis{width:100%}
    @media(max-width:600px){
      main{padding:24px 18px}
      .stage{gap:15px}
      .animation-shell{width:min(340px,100%)}
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="Nested document loading animation">
      <h1>Preparing nested document</h1>
      <div class="animation-shell">
        <div id="mitosisPreview"></div>
      </div>
    </section>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded",()=>{
      const root=document.getElementById("mitosisPreview");
      if(!root||!window.BillyMitosis?.mount)return;
      window.BillyMitosis.mount(root,{loop:true,duration:2800}).play();
    });
  </script>
</body>
</html>
