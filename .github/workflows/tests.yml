name: Billy checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-api.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q billy api.py
      - run: node --check site/app.js && node --check site/workspace.js && node --check site/scanner.js && node --check site/perspective.js && node --check site/sw.js
      - run: node --test tests/perspective.test.cjs tests/brand.test.cjs
