name: Billy checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-api.txt -r requirements-handwriting-capture.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q billy api.py
      - run: node --check site/intelligence-assistant.js && node --check site/piggybank-flight.js && node --check site/piggybank-hud.js && node --check site/organization-inbox.js && node --check site/documents-index.js && node --check site/documents-hub.js && node --check site/nested-transition.js && node --check site/nested-documents.js && node --check site/pdf-separation.js && node --check site/original-archive.js && node --check site/document-preview.js && node --check site/app.js && node --check site/accounts.js && node --check site/simple.js && node --check site/preloader.js && node --check site/vision-review.js && node --check site/workspace.js && node --check site/scanner.js && node --check site/perspective.js && node --check site/sw.js
      - run: node --test tests/perspective.test.cjs tests/brand.test.cjs tests/vision-ui.test.cjs tests/accounts-ui.test.cjs tests/simple-ui.test.cjs tests/gemini-cloud-ui.test.cjs tests/fuel-audit-ui.test.cjs tests/document-type-gate-ui.test.cjs tests/ramp-review-ui.test.cjs tests/quickverify-ui.test.cjs tests/document-deletion-ui.test.cjs tests/ui-copy-cleanup.test.cjs tests/ai-engine-copy.test.cjs tests/excel-preview-ui.test.cjs tests/original-archive.test.cjs tests/multi-documents.test.cjs tests/nested-documents.test.cjs tests/pdf-classifier-recovery.test.cjs tests/pdf-nested-visual.test.cjs tests/date-visual-recheck.test.cjs tests/operator-final-approval.test.cjs tests/nested-archive-family.test.cjs tests/organization-inbox.test.cjs tests/intelligence-assistant.test.cjs tests/piggybank-hud.test.cjs tests/piggybank-flight.test.cjs tests/vendor-alias-memory.test.cjs tests/gemini-reconnect-ui.test.cjs
