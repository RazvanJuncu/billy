name: Deploy Billy web to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: billy-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser source
        run: node --check site/intelligence-assistant.js && node --check site/organization-inbox.js && node --check site/documents-index.js && node --check site/documents-hub.js && node --check site/nested-transition.js && node --check site/nested-documents.js && node --check site/pdf-separation.js && node --check site/original-archive.js && node --check site/document-preview.js && node --check site/app.js && node --check site/accounts.js && node --check site/simple.js && node --check site/quickscan.js && node --check site/preloader.js && node --check site/vision-regions.js && node --check site/excel-preview.js && node --check site/vision-review.js && node --check site/workspace.js && node --check site/scanner.js && node --check site/perspective.js && node --check site/sw.js && node --test tests/perspective.test.cjs tests/brand.test.cjs tests/vision-ui.test.cjs tests/accounts-ui.test.cjs tests/snap-ui.test.cjs tests/crew-install.test.cjs tests/simple-ui.test.cjs tests/quickscan-ui.test.cjs tests/vision-regions-ui.test.cjs tests/scan-enhance.test.cjs tests/handwriting-ui.test.cjs tests/gemini-cloud-ui.test.cjs tests/gemini-reconnect-ui.test.cjs tests/fuel-audit-ui.test.cjs tests/document-type-gate-ui.test.cjs tests/ramp-review-ui.test.cjs tests/quickverify-ui.test.cjs tests/document-deletion-ui.test.cjs tests/ui-copy-cleanup.test.cjs tests/ai-engine-copy.test.cjs tests/excel-preview-ui.test.cjs tests/original-archive.test.cjs tests/multi-documents.test.cjs tests/nested-documents.test.cjs tests/pdf-classifier-recovery.test.cjs tests/pdf-nested-visual.test.cjs tests/date-visual-recheck.test.cjs tests/operator-final-approval.test.cjs tests/nested-archive-family.test.cjs tests/organization-inbox.test.cjs tests/intelligence-assistant.test.cjs tests/vendor-alias-memory.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
