name: Validate Auto-Detect Changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          for source in site/*.js; do node --check "$source"; done
      - name: Validate Supabase Edge function syntax
        run: node --input-type=module --check < supabase/functions/billy-vision/index.ts
      - name: Run all browser regression tests
        run: node --test tests/*.test.cjs
